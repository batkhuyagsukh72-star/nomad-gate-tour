<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Booking terms · Nomad Gate Tour</title>
<meta name="description" content="Booking terms, cancellation policy and privacy policy of Nomad Gate Tour.">
<meta name="theme-color" content="#0D0B09">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="fonts.css?v=20261106a">
<link rel="stylesheet" href="styles.css?v=20261106a">
<style>
  html,body{background:var(--night);color:var(--ivory)}
  .tm-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px var(--g);background:rgba(13,11,9,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2)}
  .tm-top .brand img:first-child{height:34px;width:auto}.tm-top .brand img:last-child{height:11px;width:auto}
  .tm-top .brand{display:inline-flex;align-items:center;gap:12px}
  .tm-r{display:flex;align-items:center;gap:12px}
  .tm-lang{font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--ivory);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:0 30px 0 14px;min-height:40px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px;background-repeat:no-repeat}
  .tm-lang option{background:var(--felt)}
  .tm-back{font:600 10.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:8px;min-height:40px}
  .tm-back svg{width:16px;height:16px;transform:scaleX(-1)}
  .tm-back:hover{color:var(--gold-hi)}
  .tm{max-width:760px;margin:0 auto;padding:clamp(48px,8vw,96px) var(--g) 80px}
  .tm h1{font:300 clamp(38px,5vw,64px)/1.05 var(--serif);margin:0 0 14px;letter-spacing:-.01em}
  .tm h2{font:300 clamp(30px,3.6vw,46px)/1.1 var(--serif);margin:88px 0 14px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:90px}
  .tm h3{font:600 11px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:34px 0 10px}
  .tm p{margin:0;color:var(--muted);line-height:1.75}
  .tm .upd{font-size:13px;color:var(--faint)}
  .tm-draft{margin:26px 0 0;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--felt);color:var(--ivory);font-size:14px;line-height:1.6}
  .tm-toc{display:flex;gap:10px 22px;flex-wrap:wrap;margin:22px 0 0}
  .tm-toc a{font:600 10.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
  .tm-toc a:hover{color:var(--gold-hi)}
  :root:lang(ko) .tm p{word-break:keep-all}
  @media (max-width:640px){ .tm-back span{display:none} .tm-top .brand img:last-child{display:none} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<header class="tm-top">
  <a class="brand" id="home" href="./"><img src="assets/logo-mark.png" alt=""><img src="assets/logo-word.png" alt="Nomad Gate Tour"></a>
  <div class="tm-r">
    <select class="tm-lang" id="lang" aria-label="Language"></select>
    <a class="tm-back" id="back" href="./"><svg><use href="#i-arrow"/></svg><span id="backTxt">Back to the site</span></a>
  </div>
</header>
<main class="tm" id="main"></main>
<script src="data.js?v=20261106a"></script>
<script src="tours.js?v=20261106a"></script>
<script src="i18n.js?v=20261106a"></script>
<script src="terms-content.js?v=20261106a"></script>
<script>
(function () {
  'use strict';
  var D = window.NGT, T = window.NGT_TERMS, cfg = D.terms || {}, c = D.contact || {};
  var langs = (D.langs || []).map(function (l) { return l.id; });
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var q = new URLSearchParams(location.search);
  var lang = [q.get('lang'), store.get('ngt-lang')].filter(function (l) { return l && T[l]; })[0] || 'en';
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[x]; }); };
  var fill = function (s) {
    var v = { company: cfg.company, address: cfg.address, email: c.email, phone: c.phone, dep: cfg.depositPct, bal: cfg.balanceDays, full: cfg.cancelFull, half: cfg.cancelHalf, late: cfg.cancelLate };
    return esc(s).replace(/\{(\w+)\}/g, function (m, k) { return v[k] !== undefined ? esc(v[k]) : m; });
  };
  var sel = document.getElementById('lang');
  sel.innerHTML = (D.langs || []).map(function (l) { return '<option value="' + l.id + '">' + esc(l.short + ' · ' + l.name) + '</option>'; }).join('');
  function render() {
    var x = T[lang];
    document.documentElement.lang = lang; sel.value = lang;
    document.title = x.title + ' · Nomad Gate Tour';
    document.getElementById('backTxt').textContent = x.back;
    document.getElementById('back').href = document.getElementById('home').href = './?lang=' + lang;
    var d = new Date((cfg.updated || '2026-11-05') + 'T00:00:00');
    var upd = x.updated + ': ' + (function () { if (lang === 'mn') return d.getFullYear() + ' оны ' + (d.getMonth() + 1) + '-р сарын ' + d.getDate(); try { return d.toLocaleDateString(lang === 'mn' ? 'mn-MN' : lang, { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return cfg.updated; } })();
    var sec = function (items) { return items.map(function (it) { return '<h3>' + fill(it[0]) + '</h3><p>' + fill(it[1]) + '</p>'; }).join(''); };
    document.getElementById('main').innerHTML =
      '<h1 id="terms">' + esc(x.title) + '</h1><p class="upd">' + esc(upd) + '</p>' +
      (cfg.draft ? '<p class="tm-draft">' + esc(x.draft) + '</p>' : '') +
      '<nav class="tm-toc"><a href="#terms">' + esc(x.title) + '</a><a href="#privacy">' + esc(x.privacy) + '</a></nav>' +
      sec(x.terms) + '<h2 id="privacy">' + esc(x.privacy) + '</h2>' + sec(x.privacyItems);
    if (location.hash === '#privacy') setTimeout(function () { var el = document.getElementById('privacy'); if (el) el.scrollIntoView(); }, 0);
  }
  sel.addEventListener('change', function () { lang = sel.value; store.set('ngt-lang', lang); try { history.replaceState(null, '', '?lang=' + lang + location.hash); } catch (e) {} render(); });
  render();
})();
</script>
</body>
</html>
