# Keeps the free Supabase project awake: Supabase pauses Free projects after 7 days without activity.
# Once a day this reads the site's content API (which queries the database).
# The last step re-enables this workflow, because GitHub turns off scheduled workflows
# in repositories with no commits for 60 days.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 3 * * *'   # every day 03:17 UTC (11:17 Ulaanbaatar)
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the content API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' --max-time 60 https://oiaagrrfkwfnnohstzqu.supabase.co/functions/v1/api/content)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then head -c 200 /tmp/r.json; echo; exit 0; fi
            sleep 30
          done
          echo "::error::Supabase did not answer - the project may be paused"; exit 1
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
