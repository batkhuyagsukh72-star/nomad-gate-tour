<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Захиалгын самбар · Nomad Gate Tour</title>
<meta name="theme-color" content="#0D0B09">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="fonts.css?v=20261106a">
<link rel="stylesheet" href="styles.css?v=20261106a">
<style>
  html,body{background:var(--night);color:var(--ivory)}
  body{min-height:100vh}
  [hidden]{display:none!important}
  .ad-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px var(--g);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:5;background:rgba(13,11,9,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .ad-brand{display:flex;align-items:center;gap:12px}.ad-brand img{height:32px;width:auto}
  .ad-brand b{font:400 20px/1 var(--serif)}
  .ad-top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .ad-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font:600 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ivory);transition:border-color .3s,color .3s,background .3s}
  .ad-btn:hover{border-color:var(--gold);color:var(--gold-hi)}
  .ad-btn.gold{background:var(--gg);color:var(--night);border:0}
  .ad-btn[disabled]{opacity:.5;cursor:progress}
  .ad-wrap{max-width:1320px;margin:0 auto;padding:28px var(--g) 80px}
  .ad-login{max-width:420px;margin:12vh auto 0;background:var(--felt);border:1px solid var(--line);padding:clamp(24px,5vw,40px);display:grid;gap:20px}
  .ad-login h1{font:300 34px/1.1 var(--serif);margin:0}
  .ad-login p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
  .ad-err{color:#E8A27A;font-size:14px;min-height:1.2em;margin:0}
  .ad-mode{display:inline-flex;align-items:center;gap:8px;font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--line);color:var(--gold-hi)}
  .ad-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 24px}
  .ad-tile{background:var(--felt);border:1px solid var(--line-2);padding:16px 18px}
  .ad-tile small{display:block;font:600 10px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .ad-tile b{font:300 28px/1.1 var(--serif);color:var(--ivory);font-variant-numeric:tabular-nums}
  .ad-tile.gold b{color:var(--gold-hi)}
  .ad-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 0 14px}
  .ad-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .ad-tabs button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font:600 10.5px/1 var(--sans);letter-spacing:.12em;color:var(--muted)}
  .ad-tabs button[aria-pressed="true"]{background:var(--ivory);color:var(--night);border-color:var(--ivory)}
  .ad-tabs button i{font-style:normal;opacity:.6;margin-left:6px}
  .ad-search{min-height:40px;min-width:240px;background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:0 16px;color:var(--ivory);font:400 14px/1 var(--sans)}
  .ad-search:focus{outline:none;border-color:var(--gold)}
  table.ad{width:100%;border-collapse:collapse;font-size:14px}
  .ad th{text-align:left;font:600 10px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:10px 10px;border-bottom:1px solid var(--line)}
  .ad td{padding:14px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--muted)}
  .ad td b{color:var(--ivory);font-weight:500}
  .ad td small{display:block;color:var(--faint);font-size:12.5px;margin-top:3px;word-break:break-word}
  .ad td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ad td.num b{color:var(--gold-hi);font-weight:400}
  .st{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:999px;white-space:nowrap}
  .st.paid{background:rgba(120,190,120,.16);color:#9FD49F}.st.requested{background:rgba(241,220,154,.14);color:var(--gold-hi)}
  .st.pending{background:rgba(243,236,223,.08);color:var(--muted)}.st.failed,.st.cancelled{background:rgba(232,162,122,.12);color:#E8A27A}
  .tag{display:inline-block;font:600 9px/1 var(--sans);letter-spacing:.14em;padding:4px 6px;border:1px solid var(--line);border-radius:4px;color:var(--faint);margin-left:6px;vertical-align:middle}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);font:600 10px/1 var(--sans);letter-spacing:.1em;color:var(--muted);white-space:nowrap}
  .acts button:hover{border-color:var(--gold);color:var(--gold-hi)}
  .acts button.confirm{border-color:var(--gold);color:var(--night);background:var(--gold-hi)}
  .ad-empty{padding:48px 0;text-align:center;color:var(--faint)}
  @media (max-width:1100px){ .ad-tiles{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:820px){
    .ad-tiles{grid-template-columns:1fr 1fr} .ad-search{min-width:0;width:100%}
    table.ad thead{display:none} table.ad,.ad tbody,.ad tr,.ad td{display:block;width:100%}
    .ad tr{background:var(--felt);border:1px solid var(--line-2);margin:0 0 12px;padding:6px 14px}
    .ad td{border:0;padding:8px 0;display:flex;justify-content:space-between;gap:16px}
    .ad td::before{content:attr(data-l);font:600 10px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);flex:0 0 38%}
    .ad td > div{text-align:right} .ad td.num{text-align:right}
    .ad-brand b{display:none}
  }
</style>
</head>
<body>
<header class="ad-top">
  <a class="ad-brand" href="./?lang=mn"><img src="assets/logo-mark.png" alt=""><b>Захиалгын самбар</b></a>
  <div class="ad-top-r" id="topR" hidden>
    <span class="ad-mode" id="mode"></span>
    <button class="ad-btn" type="button" id="refresh">Шинэчлэх</button>
    <button class="ad-btn" type="button" id="csv">CSV татах</button>
    <button class="ad-btn" type="button" id="logout">Гарах</button>
  </div>
</header>

<main class="ad-wrap">
  <form class="ad-login" id="login" novalidate>
    <h1>Захиалгын самбар</h1>
    <p>Nomad Gate Tour-ийн ажилтанд зориулсан хуудас. Танд өгсөн нууц үгийг оруулна уу.</p>
    <label class="f"><span>Нууц үг</span><input type="password" id="key" autocomplete="current-password" required></label>
    <button class="btn btn-gold btn-wide" type="submit" id="go"><span>Нэвтрэх</span></button>
    <p class="ad-err" id="err" aria-live="polite"></p>
  </form>

  <section id="dash" hidden>
    <div class="ad-tiles" id="tiles"></div>
    <div class="ad-bar">
      <div class="ad-tabs" id="tabs" role="group" aria-label="Шүүлтүүр"></div>
      <input class="ad-search" id="q" type="search" placeholder="Хайх: нэр, имэйл, дугаар" aria-label="Хайх">
    </div>
    <table class="ad">
      <thead><tr><th>Огноо</th><th>Дугаар</th><th>Аялал</th><th>Эхлэх / хүн</th><th>Захиалагч</th><th style="text-align:right">Урьдчилгаа / нийт</th><th>Төлөв</th><th>Үйлдэл</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="ad-empty" id="empty" hidden>Захиалга алга.</p>
  </section>
</main>

<script src="data.js?v=20261106a"></script>
<script src="tours.js?v=20261106a"></script>
<script>
(function () {
  'use strict';
  var D = window.NGT, API = ((D.payments && D.payments.api) || '').replace(/\/$/, '');
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var ss = { get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };
  var key = ss.get('ngt-admin'), data = [], filter = 'all', armed = null;
  var ST = { paid: 'Төлсөн', requested: 'Хүсэлт', pending: 'Хүлээгдэж буй', failed: 'Амжилтгүй', cancelled: 'Цуцалсан' };
  var MODE = { test: 'Тест горим', request: 'Төлбөргүй захиалга', live: 'Golomt (жинхэнэ)' };
  var TABS = [['all', 'Бүгд'], ['paid', 'Төлсөн'], ['open', 'Хүсэлт / хүлээгдэж буй'], ['closed', 'Цуцалсан / амжилтгүй']];
  var tourName = function (id) { var t = (D.tours || []).filter(function (x) { return x.id === id; })[0]; return t ? (t.name.mn || t.name.en) : id; };
  var money = function (v, c) { v = Number(v) || 0; return c === 'MNT' ? Math.round(v).toLocaleString('en-US') + ' ₮' : '$' + v.toLocaleString('en-US', { maximumFractionDigits: 2 }); };
  var dt = function (s) { if (!s) return ''; var d = new Date(s); var p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };

  if (!API || /claudeusercontent\.com$/.test(location.hostname)) { $('#err').textContent = 'Энэ самбар зөвхөн жинхэнэ сайт дээр ажиллана.'; $('#go').disabled = true; }

  function call(body) {
    return fetch(API + '/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ key: key }, body)) })
      .then(function (r) { return r.json().then(function (j) { if (r.status === 401) throw new Error('auth'); if (!r.ok) throw new Error(j.error || r.status); return j; }); });
  }
  function load() {
    $('#refresh').disabled = true;
    return call({ action: 'list' }).then(function (j) {
      data = j.bookings || []; $('#mode').textContent = MODE[j.mode] || j.mode;
      $('#login').hidden = true; $('#dash').hidden = false; $('#topR').hidden = false; render();
    }).catch(function (e) {
      if (e.message === 'auth') { ss.set('ngt-admin', null); key = null; $('#login').hidden = false; $('#dash').hidden = true; $('#topR').hidden = true; $('#err').textContent = 'Нууц үг буруу байна.'; }
      else $('#err').textContent = 'Холбогдож чадсангүй. Дахин оролдоно уу.';
    }).finally(function () { $('#refresh').disabled = false; $('#go').disabled = false; });
  }
  function inFilter(b) {
    if (filter === 'paid') return b.status === 'paid';
    if (filter === 'open') return b.status === 'requested' || b.status === 'pending';
    if (filter === 'closed') return b.status === 'cancelled' || b.status === 'failed';
    return true;
  }
  function render() {
    var q = $('#q').value.trim().toLowerCase();
    var paid = data.filter(function (b) { return b.status === 'paid'; });
    var sum = function (c) { return paid.filter(function (b) { return b.currency === c; }).reduce(function (a, b) { return a + Number(b.deposit); }, 0); };
    $('#tiles').innerHTML = [['Нийт захиалга', data.length], ['Төлсөн', paid.length], ['Хүлээгдэж буй', data.filter(function (b) { return b.status === 'requested' || b.status === 'pending'; }).length],
      ['Төлсөн урьдчилгаа · USD', money(sum('USD'), 'USD'), 'gold'], ['Төлсөн урьдчилгаа · MNT', money(sum('MNT'), 'MNT'), 'gold']]
      .map(function (t) { return '<div class="ad-tile ' + (t[2] || '') + '"><small>' + esc(t[0]) + '</small><b>' + esc(t[1]) + '</b></div>'; }).join('');
    $('#tabs').innerHTML = TABS.map(function (t) {
      var n = t[0] === 'all' ? data.length : data.filter(function (b) { var f = filter; filter = t[0]; var r = inFilter(b); filter = f; return r; }).length;
      return '<button type="button" data-f="' + t[0] + '" aria-pressed="' + (filter === t[0]) + '">' + esc(t[1]) + '<i>' + n + '</i></button>';
    }).join('');
    var list = data.filter(inFilter).filter(function (b) { return !q || [b.name, b.email, b.ref, b.phone].join(' ').toLowerCase().indexOf(q) > -1; });
    $('#empty').hidden = list.length > 0;
    $('#rows').innerHTML = list.map(function (b) {
      var acts = '';
      if (b.status !== 'paid') acts += '<button type="button" data-act="paid" data-ref="' + b.ref + '"' + (armed === b.ref + 'paid' ? ' class="confirm"' : '') + '>' + (armed === b.ref + 'paid' ? 'Баталгаажуулах' : 'Төлсөн болгох') + '</button>';
      if (b.status !== 'cancelled') acts += '<button type="button" data-act="cancelled" data-ref="' + b.ref + '"' + (armed === b.ref + 'cancelled' ? ' class="confirm"' : '') + '>' + (armed === b.ref + 'cancelled' ? 'Баталгаажуулах' : 'Цуцлах') + '</button>';
      if (b.status === 'cancelled') acts += '<button type="button" data-act="requested" data-ref="' + b.ref + '">Сэргээх</button>';
      return '<tr>' +
        '<td data-l="Огноо"><div>' + esc(dt(b.created_at)) + '</div></td>' +
        '<td data-l="Дугаар"><div><b>' + esc(b.ref) + '</b>' + (b.mode === 'test' ? '<span class="tag">ТЕСТ</span>' : '') + '</div></td>' +
        '<td data-l="Аялал"><div><b>' + esc(tourName(b.tour_id)) + '</b><small>' + (b.stay === 'private' ? 'Хувийн гэр' : 'Хамтын гэр') + '</small></div></td>' +
        '<td data-l="Эхлэх / хүн"><div>' + esc(b.start_date || '—') + '<small>' + esc(b.travellers) + ' хүн · ' + esc((b.lang || '').toUpperCase()) + '</small></div></td>' +
        '<td data-l="Захиалагч"><div><b>' + esc(b.name) + '</b><small><a href="mailto:' + esc(b.email) + '">' + esc(b.email) + '</a>' + (b.phone ? ' · ' + esc(b.phone) : '') + '</small>' + (b.note ? '<small>“' + esc(b.note) + '”</small>' : '') + '</div></td>' +
        '<td data-l="Урьдчилгаа / нийт" class="num"><div><b>' + esc(money(b.deposit, b.currency)) + '</b><small>' + esc(money(b.total, b.currency)) + '</small></div></td>' +
        '<td data-l="Төлөв"><div><span class="st ' + esc(b.status) + '">' + esc(ST[b.status] || b.status) + '</span>' + (b.paid_at ? '<small>' + esc(dt(b.paid_at)) + (b.card ? ' · ' + esc(b.card) : '') + '</small>' : '') + '</div></td>' +
        '<td data-l="Үйлдэл"><div class="acts">' + acts + '</div></td></tr>';
    }).join('');
  }
  $('#login').addEventListener('submit', function (e) {
    e.preventDefault(); var v = $('#key').value.trim();
    if (v.length < 12) { $('#err').textContent = 'Нууц үгээ бүтэн оруулна уу.'; return; }
    key = v; ss.set('ngt-admin', v); $('#err').textContent = ''; $('#go').disabled = true; load();
  });
  $('#tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-f]'); if (b) { filter = b.getAttribute('data-f'); render(); } });
  $('#q').addEventListener('input', render);
  $('#refresh').addEventListener('click', load);
  $('#logout').addEventListener('click', function () { ss.set('ngt-admin', null); key = null; data = []; $('#key').value = ''; $('#dash').hidden = true; $('#topR').hidden = true; $('#login').hidden = false; });
  $('#rows').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var ref = b.getAttribute('data-ref'), act = b.getAttribute('data-act');
    if (act !== 'requested' && armed !== ref + act) { armed = ref + act; render(); setTimeout(function () { if (armed === ref + act) { armed = null; render(); } }, 4000); return; }
    armed = null; b.disabled = true;
    call({ action: 'update', ref: ref, status: act }).then(load).catch(function () { $('#err').textContent = 'Хадгалж чадсангүй.'; render(); });
  });
  $('#csv').addEventListener('click', function () {
    var cols = ['ref', 'created_at', 'status', 'mode', 'tour_id', 'start_date', 'travellers', 'stay', 'currency', 'deposit', 'total', 'name', 'email', 'phone', 'lang', 'paid_at', 'note'];
    var q = function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var csv = '﻿' + cols.join(',') + '\n' + data.map(function (b) { return cols.map(function (c) { return q(b[c]); }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'nomadgate-bookings-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  });
  if (key) load();
})();
</script>
</body>
</html>
